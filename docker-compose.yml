services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector (embeddings) preinstalled
    container_name: app_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # credentials for the app's data role (used by db/init script)
      POSTGRES_APP_USER: ${APP_DB_USER}
      POSTGRES_APP_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-boot-only init: creates app_db, RLS-secured schema, sample data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: app_keycloak
    command: start-dev
    environment:
      # Initial admin user (created on first start)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Store Keycloak's own data in Postgres
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Local dev: allow plain HTTP
      KC_HTTP_ENABLED: "true"
      # Enable multi-tenant Organizations feature
      KC_FEATURES: organization
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Web UI for browsing Postgres at http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: app_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI backend: validates tokens, scopes every query to the caller's tenant
  backend:
    build: ./backend
    container_name: app_backend
    environment:
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_HOST: postgres          # docker-network hostname (NOT localhost)
      APP_DB_PORT: ${APP_DB_PORT}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # what tokens claim as issuer (URL as the user's browser sees it)
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      # where we fetch public keys (docker-network hostname)
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      TOKEN_AUDIENCE: ${TOKEN_AUDIENCE}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
