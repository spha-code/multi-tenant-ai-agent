# FastAPI backend project. Managed with uv: `uv lock` to update the lockfile,
# `uv sync` to create a local .venv, `uv run uvicorn app.main:app` to serve.
# Version ranges mirror the old requirements.txt pins (patch-safe); the exact
# resolved set lives in uv.lock.
[project]
name = "cloud-portal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",       # web framework
    "httpx>=0.27,<0.28",           # HTTP client (fetches JWKS from Keycloak)
    "uvicorn[standard]>=0.32,<0.33", # ASGI server
    "psycopg[binary,pool]>=3.2,<3.3", # Postgres driver + connection pool
    "pyjwt>=2.9,<3",               # JWT decode/signature check
    "cryptography>=50.0.2,<51",        # RSA keys used by PyJWT to verify signatures
]
