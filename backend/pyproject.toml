# FastAPI backend project. Managed with uv: `uv lock` to update the lockfile,
# `uv sync` to create a local .venv, `uv run uvicorn app.main:app` to serve.
# Version ranges mirror the old requirements.txt pins (patch-safe); the exact
# resolved set lives in uv.lock.
[project]
name = "ai-portal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0,<1",           # web framework (min raised: pulls patched starlette)
    "httpx>=0.28.1,<0.29",         # HTTP client (fetches JWKS from Keycloak)
    "uvicorn[standard]>=0.54,<0.55", # ASGI server
    "psycopg[binary,pool]>=3.3.8,<3.4", # Postgres driver + connection pool
    "pyjwt>=2.15.1,<3",              # JWT decode/signature check
    "cryptography>=50.0.2,<51",    # RSA keys used by PyJWT (min raised for CVE fixes)
]
